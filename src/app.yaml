# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title: { de: Programmierwerkstatt, en: Coding workshop }
description:
  de: Du programmierst mit Blöcken. Ein Roboter führt dein Programm aus, Schritt für Schritt. Für Klasse 7 und 8.
  en: You program with blocks. A robot runs your program, step by step. For year 7 and 8 (age 12 to 14).
howto:
  de: |
    - Wähl eine Aufgabe.
    - Zieh Blöcke in die Arbeitsfläche und steck sie zusammen. Mit der Tastatur: Tab bis zu den Blöcken, Enter fügt einen Block ein.
    - Drück „Start“. Mit „Ein Schritt“ siehst du jeden Befehl einzeln.
    - Dein Programm muss in jedem Testfall klappen.
  en: |
    - Choose a task.
    - Drag blocks onto the work area and snap them together. With the keyboard: Tab to the blocks, Enter adds a block.
    - Press “Run”. With “One step” you see each command on its own.
    - Your program has to work in every test case.
competencies:
  - de: Ich kann Anweisungen in der richtigen Reihenfolge zu einer Sequenz anordnen.
    en: I can put instructions in the right order to make a sequence.
  - de: Ich kann mit einer Wiederholung mit fester Anzahl Anweisungen mehrmals ausführen lassen.
    en: I can use a count-controlled loop to run instructions several times.
  - de: Ich kann mit einer Wiederholung mit Bedingung Anweisungen so lange ausführen lassen, bis eine Bedingung erfüllt ist.
    en: I can use a condition-controlled loop to run instructions until a condition is met.
  - de: Ich kann mit einer Verzweigung (wenn – dann – sonst) festlegen, was abhängig von einer Bedingung passiert.
    en: I can use a selection (if – then – else) to choose what happens depending on a condition.
languages: [de, en]
routes:
  - id: labyrinth-1
    title: { de: "Labyrinth 1: Um die Ecke", en: "Maze 1: Around the corner" }
  - id: labyrinth-2
    title: { de: "Labyrinth 2: Die Treppe", en: "Maze 2: The stairs" }
  - id: labyrinth-3
    title: { de: "Labyrinth 3: Immer dem Gang nach", en: "Maze 3: Follow the corridor" }
  - id: turtle-1
    title: { de: "Turtle 1: Ein Quadrat", en: "Turtle 1: A square" }
  - id: turtle-2
    title: { de: "Turtle 2: Quadrat mit Schleife", en: "Turtle 2: Square with a loop" }
  - id: turtle-3
    title: { de: "Turtle 3: Der Spirograph", en: "Turtle 3: The spirograph" }
  - id: autoren
    title: { de: "Eigene Aufgabe bauen", en: "Build your own task" }
    description:
      de: Für Lehrkräfte und Apps, die der Werkstatt eine Aufgabe als Link schicken.
      en: For teachers and apps that send the workshop a task as a link.
sections:
  - id: fuer-autoren
    title: { de: Für Lehrkräfte und Apps, en: For teachers and apps }
    text:
      de: |
        Andere Apps schicken der Werkstatt eine Aufgabe als Link. So geht's:

        - Schreib die Aufgabe als JSON nach dem [Schema](https://lernapps.net/coding/schemas/challenge.v1.schema.json). Welten: Labyrinth und Turtle.
        - Auf der Seite „Eigene Aufgabe bauen“ (in der Liste oben) prüfst du sie, probierst sie aus und kopierst den Link.
        - Ein deutscher Explainer verlinkt die deutsche Seite der Werkstatt (/coding/app/), ein englischer die englische (/coding/en/app/).
        - Zur Build-Zeit prüft das [Prüfskript](https://lernapps.net/coding/tools/challenge-check.v1.mjs) Aufgabe und Musterlösung, zum Beispiel mit „node challenge-check.v1.mjs aufgabe.json loesung.json“.
        - Der Knopf „Zurück“ führt zur Adresse in „back.url“ und hängt „#werkstatt=id-der-aufgabe:geloest“ oder „:offen“ an.
      en: |
        Other apps send the workshop a task as a link. This is how:

        - Write the task as JSON following the [schema](https://lernapps.net/coding/schemas/challenge.v1.schema.json). Worlds: maze and turtle.
        - On the page “Build your own task” (in the list above) you check it, try it out and copy the link.
        - A German explainer links the German page of the workshop (/coding/app/), an English one the English page (/coding/en/app/).
        - At build time the [check script](https://lernapps.net/coding/tools/challenge-check.v1.mjs) checks the task and a model solution, for example with “node challenge-check.v1.mjs task.json solution.json”.
        - The “Back” button leads to the address in “back.url” and adds “#werkstatt=task-id:geloest” or “:offen”.
  - id: lizenzen
    title: { de: Lizenzen, en: Licences }
    text:
      de: Die Blöcke kommen von [Blockly](https://github.com/RaspberryPiFoundation/blockly) (Apache 2.0). Labyrinth und Turtle sind nach dem Vorbild von [Blockly Games](https://github.com/google/blockly-games) (Apache 2.0) gebaut. Kiko und die Bilder der Welten sind selbst gezeichnet (CC BY 4.0).
      en: The blocks come from [Blockly](https://github.com/RaspberryPiFoundation/blockly) (Apache 2.0). Maze and turtle follow the model of [Blockly Games](https://github.com/google/blockly-games) (Apache 2.0). Kiko and the pictures of the worlds are drawn for this app (CC BY 4.0).
