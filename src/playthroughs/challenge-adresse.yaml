          kind: action,
          name: programm,
          value: [{ op: while, cond: frei, body: [{ op: cmd, name: vorwaerts }] }, { op: cmd, name: vorwaerts }],
        }
      - { kind: action, name: start }
      - { kind: action, name: schritt }
      - { kind: action, name: schritt }
      - { kind: action, name: schritt }
    state: { status: crashed, steps: 3, robot: { x: 3, y: 1 } }
