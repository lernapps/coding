# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# Ein Programm, das sich an jeder Wand nach rechts dreht: Es klappt im gezeigten Gang, aber nicht in Testfall 2.
# Dort läuft der Roboter hin und her, bis das Schrittlimit greift; die Werkstatt zeigt Testfall 2 mit dem Endstand.
seed: 1
route: labyrinth-5
steps:
  - inputs:
      [
        {
          kind: action,
          name: programm,
          value:
            {
              "main":
                [
                  {
                    "s": "while",
                    "cond": { "e": "not", "a": { "e": "sense", "name": "am-ziel", "args": [] } },
                    "body":
                      [
                        {
                          "s": "if",
                          "cond": { "e": "sense", "name": "wand-voraus", "args": [] },
                          "then": [{ "s": "cmd", "name": "rechts", "args": [] }],
                          "else": [{ "s": "cmd", "name": "vorwaerts", "args": [] }],
                        },
                      ],
                  },
                ],
            },
        },
        { kind: action, name: start },
      ]
    ticks: 400
    state:
      {
        phase: done,
        test: 2,
        run: { status: limit },
        verdict: { ok: false, test: 2, why: { key: fail-limit, params: { steps: 400 } } },
      }
    announce: "Testfall 2: Das Programm hört nicht auf: Nach 400 Befehlen ist es noch nicht fertig. Läuft Kiko hin und her oder im Kreis?"
  - inputs: [{ kind: action, name: testfall, value: 1 }]
    state: { test: 1, run: null, phase: edit, verdict: null }
