<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="sans-serif" font-size="14">
  <title>Skizze: Autorenseite (Route autoren)</title>
  <rect width="960" height="520" fill="#fff"/>
  <text x="20" y="34" font-size="22" font-weight="bold">Eigene Aufgabe bauen</text>
  <text x="20" y="62">Füge eine Challenge als JSON ein. Das Schema: coding/schemas/challenge.v1.schema.json</text>
  <rect x="20" y="80" width="560" height="300" fill="#f7f7f7" stroke="#99a"/>
  <text x="32" y="104" font-family="monospace">{ "format": 1, "id": "…", "world": { … } … }</text>
  <rect x="600" y="80" width="340" height="300" fill="#fde" stroke="#c88"/>
  <text x="612" y="104" font-weight="bold">2 Probleme</text>
  <text x="612" y="128">world.config.map: Zeile 3 hat kein Ziel Z.</text>
  <text x="612" y="150">back.url: muss mit / beginnen.</text>
  <g transform="translate(20,396)">
    <rect width="110" height="32" rx="4" fill="#ddd"/><text x="14" y="21">Prüfen</text>
    <rect x="120" width="130" height="32" rx="4" fill="#2a6"/><text x="132" y="21" fill="#fff">Ausprobieren</text>
    <rect x="260" width="130" height="32" rx="4" fill="#ddd"/><text x="272" y="21">Link kopieren</text>
    <rect x="400" width="170" height="32" rx="4" fill="#ddd"/><text x="410" y="21">Beispiel laden</text>
    <text x="0" y="62">Länge des Links: 530 von 2000 Zeichen · Sprache: /app/ (de) oder /en/app/ (en)</text>
  </g>
</svg>
