<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="sans-serif" font-size="14">
  <title>Skizze: App-Seite im Querformat / Desktop</title>
  <rect width="960" height="540" fill="#fff"/>
  <text x="20" y="34" font-size="22" font-weight="bold">Programmierwerkstatt</text>
  <text x="820" y="30">Deutsch · English</text>
  <text x="20" y="64" font-weight="bold">Der lange Gang</text>
  <text x="20" y="86">Bring den Roboter mit höchstens 3 Blöcken ans Ziel.</text>
  <text x="600" y="86" fill="#555">Blöcke: 2 von 3 · Testfall 1 von 2</text>
  <rect x="20" y="100" width="420" height="260" fill="#eef" stroke="#99a"/>
  <text x="150" y="235">Welt (SVG): Labyrinth + Roboter</text>
  <g transform="translate(20,372)">
    <rect width="70" height="30" rx="4" fill="#2a6" /><text x="16" y="20" fill="#fff">Start</text>
    <rect x="80" width="100" height="30" rx="4" fill="#ddd"/><text x="92" y="20">Ein Schritt</text>
    <rect x="190" width="70" height="30" rx="4" fill="#ddd"/><text x="203" y="20">Stopp</text>
    <rect x="270" width="110" height="30" rx="4" fill="#ddd"/><text x="278" y="20">Zurücksetzen</text>
    <text x="0" y="56">Tempo: langsam ◯──●──◯ schnell</text>
  </g>
  <rect x="20" y="446" width="420" height="78" fill="#fde" stroke="#c88"/>
  <text x="30" y="468" font-weight="bold">Testfall 2: noch nicht geschafft</text>
  <text x="30" y="490">Der Gang ist länger. Der Roboter bleibt in Feld 4 stehen.</text>
  <text x="30" y="512" fill="#06c" text-decoration="underline">Testfall 2 ansehen · Hinweis zeigen</text>
  <rect x="460" y="100" width="480" height="380" fill="#fafafa" stroke="#99a"/>
  <rect x="460" y="100" width="150" height="380" fill="#e8e8e8"/>
  <text x="472" y="130">Blöcke (Flyout)</text>
  <text x="640" y="250">Arbeitsfläche (Blockly)</text>
  <text x="460" y="500" fill="#06c" text-decoration="underline">← Zurück zur Erklärung</text>
  <text x="700" y="500" fill="#555">Ergebnis kopieren</text>
</svg>
